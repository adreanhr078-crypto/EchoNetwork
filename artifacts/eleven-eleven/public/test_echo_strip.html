<!DOCTYPE html>
<html>
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "/node_modules/three/examples/jsm/loaders/GLTFLoader.js"
      }
    }
  </script>
  <style>body { margin: 0; background: #16202c; }</style>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#16202c');
    const camera = new THREE.PerspectiveCamera(45, 1200 / 400, 0.1, 100);
    camera.position.set(0, 1.1, 3.5);
    camera.lookAt(0, 0.85, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(1200, 400);
    document.body.appendChild(renderer.domElement);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x556677, 2.5);
    scene.add(hemiLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight.position.set(2, 4, 3);
    scene.add(dirLight);

    const loader = new GLTFLoader();
    loader.load('/assets/characters/echo.glb', (gltf) => {
      const walk = gltf.animations.find(a => a.name === 'WALK');
      const duration = walk.duration || 1.0;
      
      const times = [0.0, 0.25, 0.5, 0.75, 0.95];
      times.forEach((t, i) => {
        loader.load('/assets/characters/echo.glb', (g2) => {
          const clone = g2.scene;
          clone.position.x = (i - 2) * 0.9;
          scene.add(clone);
          const mixer = new THREE.AnimationMixer(clone);
          const action = mixer.clipAction(walk);
          action.play();
          mixer.update(t * duration);
          if (i === 4) {
            setTimeout(() => {
              renderer.render(scene, camera);
              window.__READY__ = true;
            }, 100);
          }
        });
      });
    });
  </script>
</body>
</html>
